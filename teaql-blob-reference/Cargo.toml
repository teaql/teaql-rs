[package]
name = "teaql-blob-reference"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional TeaQL Blob policies, verified transport and transaction-bound catalog"

[features]
live-postgres = []
runtime-integration = ["dep:teaql-runtime", "dep:tokio", "dep:getrandom", "dep:futures-util", "dep:chrono", "dep:async-trait"]

[dependencies]
teaql-blob-contracts.workspace = true
teaql-runtime = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
getrandom = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }
chrono = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
teaql-core.workspace = true
teaql-data-service.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
teaql-macros.workspace = true
async-trait.workspace = true
teaql-blob-store-file = { workspace = true, features = ["http-gateway"] }
teaql-blob-content-native.workspace = true
tempfile = "3"
tokio.workspace = true
teaql-provider-postgres.workspace = true
teaql-runtime.workspace = true
teaql-secure-document-reference.workspace = true
teaql-sql.workspace = true
teaql-web-integration-axum.workspace = true
axum = { version = "0.8" }
deadpool-postgres = "0.14"
tokio-postgres = "0.7"
