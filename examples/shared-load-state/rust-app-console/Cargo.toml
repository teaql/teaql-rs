[package]
name = "shared-load-state-example"
version = "0.1.0"
edition = "2021"
publish = false

[features]
inheritance = []

[dependencies]
school_management_service_core = { package = "school-management-service-core", path = "../rust-lib-core/lib" }
teaql-core = { path = "../../../teaql-core" }
teaql-runtime = { path = "../../../teaql-runtime" }
teaql-data-service = { path = "../../../teaql-data-service" }
teaql-provider-sqlite = { path = "../../../teaql-provider-sqlite" }
teaql-sql = { path = "../../../teaql-sql" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
futures-util = "0.3"
chrono = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
teaql-macros = { path = "../../../teaql-macros" }
futures-executor = "0.3"

[workspace]

[patch.crates-io]
teaql-core = { path = "../../../teaql-core" }
teaql-macros = { path = "../../../teaql-macros" }
teaql-data-service = { path = "../../../teaql-data-service" }
teaql-sql = { path = "../../../teaql-sql" }
teaql-runtime = { path = "../../../teaql-runtime" }
teaql-provider-sqlite = { path = "../../../teaql-provider-sqlite" }

[[test]]
name = "generated_query_benchmark"
path = "../tests/generated_query_benchmark.rs"

[[test]]
name = "generated_school"
path = "../tests/generated_school.rs"

[[test]]
name = "inherited_school"
path = "../tests/inherited_school.rs"
required-features = ["inheritance"]

[[test]]
name = "mainstream_orm_benchmark"
path = "../tests/mainstream_orm_benchmark.rs"

[[test]]
name = "wide_hydration_allocations"
path = "../tests/wide_hydration_allocations.rs"

[[example]]
name = "cold_query_probe"
path = "../examples/cold_query_probe.rs"
