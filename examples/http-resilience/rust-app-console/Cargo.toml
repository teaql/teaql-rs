[package]
name = "supplier-order-sync-service-core-workspace"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Application workspace for the TeaQL domain crate supplier-order-sync-service-core"
license = "MIT OR Apache-2.0"

[dependencies]
supplier_order_sync_service_core = { package = "supplier-order-sync-service-core", path = "../rust-lib-core/lib" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
teaql-core = "8.1.0"
chrono = "0.4"
teaql-runtime = "8.1.0"
teaql-http-reqwest = { path = "../../../teaql-http-reqwest" }
serde_json = "1"
url = "2"

[features]
standard-telemetry = ["teaql-runtime/standard-telemetry"]

[workspace]

[patch.crates-io]
teaql-core = { path = "../../../teaql-core" }
teaql-macros = { path = "../../../teaql-macros" }
teaql-runtime = { path = "../../../teaql-runtime" }
teaql-data-service = { path = "../../../teaql-data-service" }
teaql-sql = { path = "../../../teaql-sql" }
teaql-provider-sqlite = { path = "../../../teaql-provider-sqlite" }
