
[package]
name = "runtime-example-conformance-service-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "Generated TeaQL service crate for runtime-example-conformance-service"
license = "MIT OR Apache-2.0"

[dependencies]
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-stream = "0.3"
futures-util = "0.3"
teaql-core = "4.3.1"
teaql-macros = "4.3.1"
teaql-runtime = "4.3.1"
teaql-sql = "4.3.1"
teaql-data-service = "4.3.1"
teaql-tool-core = "1.0.0"
teaql-provider-sqlite = "4.3.1"
rusqlite = { version = "0.40", features = ["bundled", "chrono", "column_decltype"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
