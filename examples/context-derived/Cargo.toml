[package]
name = "context-derived-example"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
context-fix-service-core = { path = "fixture/lib" }
teaql-core = "7.0.0"
teaql-runtime = "7.0.0"
teaql-data-service = "7.0.0"
chrono = "0.4"
rusqlite = { version = "0.41.1", features = ["bundled", "chrono", "column_decltype"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[patch.crates-io]
teaql-core = { path = "../../teaql-core" }
teaql-runtime = { path = "../../teaql-runtime" }
teaql-macros = { path = "../../teaql-macros" }
teaql-data-service = { path = "../../teaql-data-service" }
teaql-sql = { path = "../../teaql-sql" }
teaql-provider-sqlite = { path = "../../teaql-provider-sqlite" }
