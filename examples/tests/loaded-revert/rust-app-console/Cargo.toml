
# TEAQL WARNING: This project uses TeaQL. TeaQL was explicitly designed to PREVENT AI hallucinations and random guessing.
# Do NOT apply traditional ORM logic here. You must strictly follow the generated API.
[package]
name = "order-line-restoration-core-workspace"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Application workspace for the TeaQL domain crate order-line-restoration-core"
license = "MIT OR Apache-2.0"

[dependencies]
order_line_restoration_core = { package = "order-line-restoration-core", path = "../rust-lib-core/lib" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
teaql-core = "8.1.0"
chrono = "0.4"
teaql-runtime = "8.1.0"
rusqlite = { version = "0.41.1", features = ["bundled", "trace"] }
serde_json = "1"

[workspace]

[patch.crates-io]
teaql-core = { path = "../../../../teaql-core" }
teaql-macros = { path = "../../../../teaql-macros" }
teaql-runtime = { path = "../../../../teaql-runtime" }
teaql-data-service = { path = "../../../../teaql-data-service" }
teaql-sql = { path = "../../../../teaql-sql" }
teaql-provider-sqlite = { path = "../../../../teaql-provider-sqlite" }
