[package]
name = "school-management-bootstrap-example"
version = "0.1.0"
edition = "2021"
default-run = "school-management-bootstrap-example"

[dependencies]
school_management_service_core = { package = "school-management-service-core", path = "lib" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rusqlite = "0.40"

[workspace]

[patch.crates-io]
teaql-core = { path = "../../teaql-core" }
teaql-macros = { path = "../../teaql-macros" }
teaql-runtime = { path = "../../teaql-runtime" }
teaql-sql = { path = "../../teaql-sql" }
teaql-data-service = { path = "../../teaql-data-service" }
teaql-provider-sqlite = { path = "../../teaql-provider-sqlite" }
