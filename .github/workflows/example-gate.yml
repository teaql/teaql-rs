name: Example Gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/verify-examples.sh
