[package]
name = "teaql-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
futures-core = "0.3"
futures-util = "0.3"
chrono = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
teaql-core = { workspace = true }
teaql-sql = { workspace = true }
teaql-data-service = { workspace = true }
async-trait = { workspace = true }
opentelemetry = { version = "0.32.0", optional = true }

[features]
opentelemetry = ["dep:opentelemetry"]

[dev-dependencies]
teaql-macros = { workspace = true }
tokio = { workspace = true }
opentelemetry_sdk = { version = "0.32.1", features = ["testing"] }
opentelemetry-otlp = { version = "0.32.0", default-features = true }
