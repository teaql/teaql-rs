[package]
name = "teaql-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
futures-core = "0.3"
futures-util = "0.3"
chrono = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
rust_decimal = { workspace = true }
teaql-core = { workspace = true }
teaql-sql = { workspace = true }
teaql-data-service = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry_sdk = { version = "0.32.1", optional = true, default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-proto = { version = "0.32.0", optional = true, default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs"] }
prost = { version = "0.14", optional = true }
reqwest = { version = "0.13.4", optional = true, default-features = false, features = ["blocking", "rustls"] }
url = "2"
aes-gcm = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }

[features]
opentelemetry = ["dep:opentelemetry"]
standard-telemetry = ["opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-proto", "dep:prost", "dep:reqwest"]

[dev-dependencies]
teaql-macros = { workspace = true }
opentelemetry_sdk = { version = "0.32.1", features = ["testing"] }
opentelemetry-otlp = { version = "0.32.0", default-features = true }
